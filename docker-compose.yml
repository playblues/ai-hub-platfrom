version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-ai_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai_network

  redis:
    image: redis:7-alpine
    container_name: ai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ai_network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ai_api
    restart: unless-stopped
    environment:
      PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-ai_platform}
      POSTGRES_SSLMODE: disable
      REDIS_ADDR: redis:6379
      LLM_API_KEY: ${LLM_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai_network

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: ai_bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      API_URL: http://api:8080
    depends_on:
      - api
    networks:
      - ai_network

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ai_frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - api
    networks:
      - ai_network

volumes:
  postgres_data:
  redis_data:

networks:
  ai_network:
    driver: bridge